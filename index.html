<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="container my-5 d-flex flex-column gap-3 align-items-center">
        <div class="input__container">
          <div class="shadow__input"></div>
          <button class="input__button__shadow" onclick="search()">
            <svg
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              height="20px"
              width="20px"
            >
              <path
                d="M4 9a5 5 0 1110 0A5 5 0 014 9zm5-7a7 7 0 104.2 12.6.999.999 0 00.093.107l3 3a1 1 0 001.414-1.414l-3-3a.999.999 0 00-.107-.093A7 7 0 009 2z"
                fill-rule="evenodd"
                fill="#17202A"
              ></path>
            </svg>
          </button>
          <input
            type="text"
            name="search"
            id="search"
            class="input__search"
            placeholder="What do you want to search?"
          />
        </div>

        <div class="dial">
          <label class="off">
            <input
              checked=""
              name="fan-speed"
              value="not"
              type="radio"
              class="inputBox"
            />
            <div class="button">Not</div>
          </label>
          <label>
            <input
              name="fan-speed"
              value="liked"
              type="radio"
              class="inputBox"
              checked
            />
            <div class="button">Liked</div>
          </label>
        </div>
      </div>

      <div class="container d-flex flex-column align-items-center gap-3">
        <h1 id="count" class="d-none"></h1>
        <div
          class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 p-4"
        ></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/script.js"></script>
  </body>
</html>
